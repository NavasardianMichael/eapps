# =============================================================================
# nginx — eapps.site (Next.js). Install to /etc/nginx/sites-available/eapps.site.conf
# and symlink into sites-enabled. Paths assume APP_DIR=/home/michael/apps/eapps.
#
# www.eapps.site 301s here on both HTTP and HTTPS — do not proxy www, or canonicals,
# hreflang and the sitemap see a second origin.
#
# This vhost names only the apex and www. App subdomains (crossword.eapps.site, …) keep
# their own vhosts; nginx picks by server_name, so they never fall through to this one.
#
# Every page is prerendered inside the Next server, so nginx proxies HTML to Node and serves
# only the hashed build assets off disk.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name eapps.site;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.eapps.site;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://eapps.site$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.eapps.site;

    ssl_certificate     /etc/letsencrypt/live/eapps.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eapps.site/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://eapps.site$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eapps.site;

    ssl_certificate     /etc/letsencrypt/live/eapps.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eapps.site/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Hashed, immutable build assets, served straight off disk. The path runs through
    # current, so a release swap is picked up with no nginx reload.
    location /_next/static/ {
        alias /home/michael/apps/eapps/current/.next/static/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # /_next/image is the image optimizer, not a static path. It is deliberately NOT
    # matched above so it falls through to Node.

    location / {
        proxy_pass http://127.0.0.1:7008;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next streams RSC payloads; buffering them delays first paint.
        proxy_buffering off;

        # NEVER add proxy_cache to this block. src/proxy.ts answers `/` with a personalised
        # 307 (`Vary: Accept-Language, Cookie`, `no-store`) — caching it pins the first
        # visitor's language onto everybody else. Pages are already prerendered in Next.

        proxy_read_timeout 30s;
    }

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml application/manifest+json image/svg+xml;
    gzip_min_length 256;
}
