# =============================================================================
# nginx — eapps.site (Next.js). Install to /etc/nginx/sites-available/eapps.site.conf and
# symlink into sites-enabled (docs/PRODUCTION_SETUP.md, step 4). Paths assume
# APP_DIR=/home/michael/apps/eapps.
#
# www.eapps.site (on the same certificate) 301s here on both HTTP and HTTPS — never proxy
# www, or canonicals, hreflang, the sitemap and the JSON-LD ids see a second origin.
#
# This file names only the apex and www. The apps' own subdomains (crossword.eapps.site, …)
# keep their own vhosts; nginx matches by server_name, so they never fall through to this one.
#
# Every page is prerendered inside the Next server, so nginx proxies HTML to Node and serves
# only the hashed build assets off disk. There is no API host: the site has no server layer.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name eapps.site;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.eapps.site;

    location / {
        return 301 https://eapps.site$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.eapps.site;

    ssl_certificate     /etc/letsencrypt/live/eapps.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eapps.site/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://eapps.site$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eapps.site;

    ssl_certificate     /etc/letsencrypt/live/eapps.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eapps.site/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Apex only, no includeSubDomains: each app subdomain decides its own HTTPS policy.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Hashed, immutable build assets, served straight off disk. The path runs through
    # current, so a release swap is picked up with no nginx reload.
    location /_next/static/ {
        alias /home/michael/apps/eapps/current/.next/static/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # /_next/image is the image optimizer, not a static path. It is deliberately NOT
    # matched above so it falls through to Node.

    location / {
        proxy_pass http://127.0.0.1:7008;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next streams RSC payloads; buffering them delays first paint until the whole
        # render finishes.
        proxy_buffering off;

        # NEVER add proxy_cache to this block. src/proxy.ts answers `/` with a personalised
        # 307 carrying `Vary: Accept-Language, Cookie` and `Cache-Control: no-store` —
        # caching it pins the first visitor's language onto everybody else. Pages are
        # already prerendered inside Next.

        proxy_read_timeout 30s;
    }

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml application/manifest+json image/svg+xml;
    gzip_min_length 256;
}
