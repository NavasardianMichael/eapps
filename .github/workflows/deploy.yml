# =============================================================================
# Build and deploy eapps.site to production.
#
# Full operator documentation: docs/DEPLOYMENT.md (how it works) and
# docs/PRODUCTION_SETUP.md (the one-time server setup, in order).
#
# The site has no server layer — no API, no database, no env file on the host. One side
# deploys: the Next standalone bundle.
#
# REQUIRED REPOSITORY SECRETS:
#   SSH_HOST, SSH_USER, SSH_KEY, SSH_PORT (optional, default 22)
#   APP_DIR                deployment root, e.g. /home/michael/apps/eapps
#   NEXT_PUBLIC_SITE_URL   https://eapps.site
#
# OPTIONAL SECRETS, inlined at build time — empty turns the feature off:
#   NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION
#
# The NEXT_PUBLIC_* values are inlined into the browser bundle, so they are public by
# construction. They are kept as Secrets, but this workflow also accepts Variables: it
# reads secrets.* first, then vars.*. Those are different stores: a value in one is
# invisible to the other, and a Secret with the same name as a Variable wins.
#
# On-host layout:
#   $APP_DIR/releases/<sha>/   Next standalone bundle (server.js, .next, public)
#   $APP_DIR/current        -> releases/<sha>
# =============================================================================

name: Deploy to Production

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      # Host templates are copied by hand (docs/PRODUCTION_SETUP.md); a deploy never touches them.
      - 'deployment/**'
      - '.claude/**'
      - '.cursor/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  KEEP_RELEASES: 3
  WEB_PORT: 7008
  SSH_OPTS: '-o ServerAliveInterval=30 -o ServerAliveCountMax=120 -o TCPKeepAlive=yes -o ConnectTimeout=30'

# Deploys queue rather than abort: cancelling mid-script could leave `current`
# pointing at a release whose service was never restarted.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # The non-build half of `pnpm verify`; the build job below covers the rest.
      - run: pnpm typecheck
      - run: pnpm gates
      - run: pnpm lint
      - run: pnpm check:messages
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: verify
    env:
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION || vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      # An empty origin falls back to http://localhost:7008, and every canonical, hreflang,
      # sitemap entry, JSON-LD id and llms.txt link would ship pointing at the visitor's own
      # machine. Fail before that bundle exists.
      - name: Require the public origin
        run: |
          value="$NEXT_PUBLIC_SITE_URL"
          if [ -z "$value" ]; then
            echo "::error::NEXT_PUBLIC_SITE_URL is empty. Set it as a repository Secret (Settings → Secrets and variables → Actions), not an Environment secret."
            exit 1
          fi
          if printf '%s' "$value" | grep -Eqi 'localhost|127\.0\.0\.1|^http://|/$'; then
            echo "::error::NEXT_PUBLIC_SITE_URL must be the public https origin with no trailing slash (https://eapps.site)."
            exit 1
          fi
          echo "building for $value"

      - name: Build
        run: pnpm build

      # `output: 'standalone'` traces node_modules into .next/standalone but leaves
      # public/ and .next/static out on purpose — a CDN would normally serve them.
      # We serve them from nginx off the same directory, so they have to be copied in.
      - name: Assemble standalone bundle
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          test -f .next/standalone/server.js
          tar -czf web-build.tar.gz -C .next/standalone .
          echo "bundle: $(du -sh web-build.tar.gz | cut -f1)"

      # Boot what actually ships. Output file tracing can copy a package's manifest without
      # the files behind its `exports` map, and the result is an ERR_MODULE_NOT_FOUND that
      # appears only when node runs server.js — `next build` stays green. With no API behind
      # it, a real page can be rendered here: /en must answer 200.
      - name: Smoke-test the standalone bundle
        working-directory: .next/standalone
        env:
          PORT: ${{ env.WEB_PORT }}
          HOSTNAME: 127.0.0.1
          NODE_ENV: production
        run: |
          node server.js > /tmp/web-smoke.log 2>&1 &
          pid=$!
          for i in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::the standalone bundle exited before it listened on $PORT"
              cat /tmp/web-smoke.log
              exit 1
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://127.0.0.1:$PORT/en" || true)
            if [ "$code" = "200" ]; then
              echo "standalone bundle answered /en with 200 after ${i}s"
              kill "$pid" 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          echo "::error::the standalone bundle never answered /en with 200 on port $PORT"
          cat /tmp/web-smoke.log
          kill "$pid" 2>/dev/null || true
          exit 1

      - uses: actions/upload-artifact@v6
        with:
          name: web-build
          path: web-build.tar.gz
          retention-days: 1

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v7
        with:
          name: web-build

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT || 22 }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy artifact to host
        run: |
          scp ${{ env.SSH_OPTS }} -P "${{ secrets.SSH_PORT || 22 }}" \
            web-build.tar.gz "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/eapps-web-build.tar.gz"

      - name: Deploy
        run: |
          ssh ${{ env.SSH_OPTS }} -p "${{ secrets.SSH_PORT || 22 }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -s -- \
            "${{ secrets.APP_DIR }}" \
            "${{ github.sha }}" \
            "${{ env.KEEP_RELEASES }}" \
            "${{ env.WEB_PORT }}" << 'EOF'
          set -euo pipefail
          APP_DIR="$1"; RELEASE="$2"; KEEP="$3"; WEB_PORT="$4"

          if [ -z "$APP_DIR" ]; then
            echo "::error::APP_DIR is empty — set the repository secret (docs/PRODUCTION_SETUP.md, step 5)"
            exit 1
          fi
          mkdir -p "$APP_DIR/releases"

          wait_for() {
            local name="$1" url="$2" unit="$3"
            for i in $(seq 1 45); do
              if curl -sf -o /dev/null --max-time 5 "$url"; then
                echo "$name healthy after $((i * 2))s"
                return 0
              fi
              sleep 2
            done
            echo "::error::$name did not become healthy within 90s ($url)"
            systemctl status "$unit" --no-pager --lines=20 || true
            journalctl -u "$unit" -n 200 --no-pager || true
            return 1
          }

          echo "==> web $RELEASE"
          NEW="$APP_DIR/releases/$RELEASE"
          rm -rf "$NEW"; mkdir -p "$NEW"
          tar -xzf /tmp/eapps-web-build.tar.gz -C "$NEW"
          ln -sfn "$NEW" "$APP_DIR/current"
          sudo systemctl restart eapps-web
          # /en, never /: localePrefix is 'always', so / is a 307 by design.
          wait_for "web" "http://127.0.0.1:$WEB_PORT/en" eapps-web

          # Keep the newest $KEEP releases so a rollback target survives.
          ( cd "$APP_DIR/releases" && ls -t | tail -n +$((KEEP + 1)) | xargs -r rm -rf )

          rm -f /tmp/eapps-web-build.tar.gz
          echo "==> done"
          EOF

      - name: Summary
        if: always()
        run: |
          {
            echo "## Deployment"
            echo "**Release:** \`${{ github.sha }}\`"
            echo ""
            echo "- web (\`current\`, systemd \`eapps-web\`) → https://eapps.site"
          } >> "$GITHUB_STEP_SUMMARY"
