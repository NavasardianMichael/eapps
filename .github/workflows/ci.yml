# =============================================================================
# CI — the `pnpm verify` gate, on every pull request. Steps are spelled out so the
# Actions UI names the gate that broke, fastest-failing first.
# =============================================================================

name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck
      - name: Grep gates
        run: pnpm gates
      - name: Lint
        run: pnpm lint
      - name: Message catalogues
        run: pnpm check:messages
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: https://eapps.site
